default:
  image: registry.csc.sibsutis.ru/trpo/ci

.check-codestyle:
  script:
    - echo "Check codestyle..."
    - git ls-files *.c *.h | xargs clang-format -i --verbose && git diff --exit-code
    - echo "Codestyle is fine."

stages:
  - check-codestyle
  - build
  - test

checkstyle:
  stage: check-codestyle
  extends: .check-codestyle

build:
  stage: build
  script:
    - make clean
    - make
  artifacts:
    paths:
      - bin/

test:
  stage: test
  script:
    - make test